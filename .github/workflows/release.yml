name: Release

# Start it by pushing a tag like v1.1.0, or from the Actions tab ("Run workflow"),
# which releases the version in plugin.json and creates its tag. Either way it:
#   1. runs the full validation (validate.yml); the release stops if it fails,
#   2. builds dist/prompt-anatomy.zip and publishes a GitHub Release with the zip and the validation report,
#   3. commits the validation report to main under validation/<tag>/ as a permanent record.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      run_evals: true
    secrets: inherit

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        run: |
          want="v$(jq -r .version plugins/prompt-anatomy/.claude-plugin/plugin.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="$want"; fi
          if [ "$tag" != "$want" ]; then
            echo "Tag $tag does not match plugin.json version ($want)"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: validation-report
          path: validation-report

      - name: Build
        run: |
          ./scripts/build.sh
          (cd validation-report && zip -qr ../dist/validation-report.zip .)
          cp validation-report/SUMMARY.md dist/validation-summary.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/prompt-anatomy.zip dist/validation-report.zip dist/validation-summary.md \
            --target "$GITHUB_SHA" --title "Prompt Anatomy $TAG" "$@"

      - name: Commit the validation report to main
        run: |
          git fetch origin main && git checkout -B main origin/main
          rm -rf "validation/$TAG" && mkdir -p "validation/$TAG"
          cp -R validation-report/. "validation/$TAG/"
          cp "validation/$TAG/status.json" validation/latest-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add validation
          git commit -m "Validation report for $TAG" && git push origin main || echo "Nothing to commit"
