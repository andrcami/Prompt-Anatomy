name: Release

# Pushing a tag like v1.1.0 builds the skill zip and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches plugin.json
        run: |
          want="v$(jq -r .version plugins/prompt-anatomy/.claude-plugin/plugin.json)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version ($want)"; exit 1
          fi

      - name: Build
        run: ./scripts/build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/prompt-anatomy.zip \
            --title "Prompt Anatomy $GITHUB_REF_NAME" "$@"
